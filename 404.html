<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer" />
    <title>页面不存在</title>
    <style>
        /* 和首页完全一模一样的样式 */
        body {
            background-color: #fffaf0; /* 米白色背景板，和首页统一 */
            font-family: "Microsoft Yahei", sans-serif;
            margin: 0;
            padding: 40px;
        }
        .menu-box {
            background-color: #f8e9dd; /* 肉色盒子 */
            max-width: 700px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
        }
        .back-btn{
            display:inline-block;
            padding:14px 20px;
            margin-top:20px;
            background-color: #fff6ee;
            border-radius: 10px;
            font-size: 18px;
            color: #6b4b37;
            text-decoration: none;
        }
        .back-btn:hover{
            background-color: #f9e2d0;
        }
    </style>
</head>
<body>
    <div class="menu-box">
        <h2>页面不存在</h2>
        <p>你访问的子目录还没有制作哦</p>
        <!-- 返回首页链接，这里首页是 index.html -->
        <a class="back-btn" href="./index.html">返回哈吉米首页</a>
    </div>
</body>
</html>
